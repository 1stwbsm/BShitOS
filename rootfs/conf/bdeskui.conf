# Read by bdeskui; your own ~/.bdeskui.conf wins. BSconf writes skin and mouse_speed there.
# Skins: night, aqua, dos, concrete. The login screen uses the skin set here.
skin=night
mouse_speed=1
# Programs that have a graphical mode: from the desktop they open in a window
# of their own (started with --graphical). Everything else opens in a terminal window.
windowed=web
