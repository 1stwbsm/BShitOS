# Read by bdeskui; your own ~/.bdeskui.conf wins. Settings writes skin and mouse_speed there.
skin=night
mouse_speed=1
# Programs that draw the whole screen themselves; BDeskUI hands it over.
fullscreen=web cube edit
# Programs that talk on the text console (passwords, prompts): BDeskUI steps
# aside to the TTY while they run, then comes back.
tty=su passwd install useradd userdel bsh login
