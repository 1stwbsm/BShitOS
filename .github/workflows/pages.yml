# Builds the web version (make web) and publishes it to GitHub Pages.
name: Web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build
        run: make -j"$(nproc)" web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
